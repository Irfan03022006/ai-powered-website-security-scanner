<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI-Powered Website Security Scanner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">🛡️ AI Security Scanner</a>
      <nav>
        <a href="{{ url_for('index') }}">New Scan</a>
        <a href="{{ url_for('history') }}">History</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>Educational, defensive security tool. Only scan websites you own or are authorized to test.
      Not a replacement for a professional penetration test.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
